<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymRat" />
  <meta name="theme-color" content="#050505" />
  <title>GymRat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-black: #050505;
      --bg-surface: rgba(18, 18, 22, 0.94);
      --bg-surface-dim: rgba(12, 12, 15, 0.68);
      --bg-elevated: rgba(26, 26, 32, 0.92);
      --glass-grey: rgba(145, 148, 158, 0.16);
      --border-dim: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --border-lit: rgba(255, 178, 102, 0.58);
      --glow-amber: rgba(255, 168, 76, 0.24);
      --accent-amber: #ffb266;
      --accent-amber-soft: #ffe0be;
      --danger-bg: rgba(239, 68, 68, 0.22);
      --danger-border: rgba(248, 113, 113, 0.65);
      --danger-text: #fca5a5;
      --text-main: #f6f6f8;
      --text-muted: #8c8f99;
      --ok-bg: rgba(34, 197, 94, 0.18);
      --ok-border: rgba(74, 222, 128, 0.52);
      --ease-glide: cubic-bezier(0.22, 0.72, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      overflow-x: clip;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "Plus Jakarta Sans", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(255, 178, 102, 0.09), transparent 48%),
        var(--bg-black);
      color: var(--text-main);
      padding-bottom: calc(128px + env(safe-area-inset-bottom));
      position: relative;
      font-variant-numeric: tabular-nums;
    }

    h1, h2, h3, .brand-font {
      font-family: "Fredoka", "Trebuchet MS", sans-serif;
      letter-spacing: -0.01em;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    button, .dock, .section-card, .circle-btn, .check-box, .set-badge, .set-row {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .section-card {
      background: var(--bg-surface-dim);
      border: 1px solid var(--border-dim);
      border-radius: 18px;
      opacity: 0.78;
      transition:
        opacity 0.26s var(--ease-glide),
        border-color 0.26s var(--ease-glide),
        box-shadow 0.26s var(--ease-glide),
        background 0.26s var(--ease-glide),
        transform 0.26s var(--ease-glide);
    }

    .section-card:hover,
    .section-card:focus-within,
    .section-card.lit {
      opacity: 1;
      background: var(--bg-surface);
      border-color: var(--border-lit);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.72),
        0 0 24px var(--glow-amber),
        inset 0 1px 0 rgba(255, 224, 190, 0.18);
    }

    .circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--glass-grey);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.18s var(--ease-glide), border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .circle-btn:hover,
    .circle-btn:active {
      border-color: var(--border-lit);
      box-shadow: 0 0 16px var(--glow-amber);
    }

    .circle-btn:active {
      transform: scale(0.92);
    }

    .circle-btn.sm {
      width: 30px;
      height: 30px;
      font-size: 0.76rem;
    }

    .circle-btn.solid {
      background: rgba(246, 246, 248, 0.95);
      color: #050505;
      border-color: #ffffff;
    }

    .pill-btn {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--glass-grey);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 7px 13px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
      transition: transform 0.18s var(--ease-glide), border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .pill-btn:hover {
      border-color: var(--border-lit);
      box-shadow: 0 0 14px var(--glow-amber);
    }

    .pill-btn:active {
      transform: scale(0.95);
    }

    .pill-btn.solid {
      background: rgba(246, 246, 248, 0.95);
      color: #050505;
      border-color: #ffffff;
      font-weight: 800;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-dim);
    }

    .topbar-inner {
      max-width: 660px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-bubble {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 178, 102, 0.16);
      border: 1px solid var(--border-lit);
      box-shadow: 0 0 18px var(--glow-amber);
      font-family: "Fredoka", "Trebuchet MS", sans-serif;
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--accent-amber-soft);
      max-width: calc(100% - 54px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: transform 0.28s var(--ease-glide), opacity 0.28s var(--ease-glide);
    }

    .brand-title {
      margin: 0;
      font-size: 1.24rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-amber);
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 1px;
      letter-spacing: 0.01em;
    }

    .bust-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .main-shell {
      max-width: 660px;
      margin: 0 auto;
      padding: 12px 12px 0;
      position: relative;
      z-index: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: smoothGlideIn 0.42s var(--ease-glide) both;
    }

    .view.active.glide-left {
      animation-name: smoothGlideFromRight;
    }

    .view.active.glide-right {
      animation-name: smoothGlideFromLeft;
    }

    @keyframes smoothGlideIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes smoothGlideFromRight {
      0% {
        opacity: 0;
        transform: translateX(36px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes smoothGlideFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-36px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pad {
      padding: 14px;
    }

    .head-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sec-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .muted-xs {
      font-size: 0.69rem;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    input, select, textarea {
      font-size: 16px;
      font-family: inherit;
    }

    .clean-input,
    .clean-select {
      flex: 1 1 110px;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid var(--border-dim);
      background: rgba(9, 9, 12, 0.94);
      padding: 8px 11px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .clean-input:focus,
    .clean-select:focus {
      border-color: var(--border-lit);
      box-shadow: 0 0 0 3px rgba(255, 178, 102, 0.12);
    }

    .row-gap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* ANATOMIA DETTAGLIATA (FRONTE + RETRO) */
    .anatomy-panel {
      margin-top: 10px;
      padding: 10px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(11, 11, 15, 0.92), rgba(7, 7, 9, 0.92));
      border: 1px solid var(--border-dim);
    }

    .anatomy-svg {
      width: 100%;
      max-width: 256px;
      height: 162px;
      display: block;
      margin: 0 auto;
    }

    .anat-outline {
      fill: rgba(255, 255, 255, 0.035);
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .anat-striation {
      fill: none;
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 0.75;
      stroke-linecap: round;
    }

    .anat-muscle {
      fill: rgba(255, 255, 255, 0.07);
      stroke: rgba(255, 255, 255, 0.24);
      stroke-width: 1.05;
      transition: fill 0.22s ease, stroke 0.22s ease;
    }

    .anat-muscle.active-m {
      fill: rgba(255, 178, 102, 0.88);
      stroke: #ffe6ca;
      stroke-width: 1.3;
    }

    /* ILLUSTRAZIONE DEDICATA PER SINGOLO ESERCIZIO */
    .ex-thumb-svg {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(255, 178, 102, 0.08), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border-subtle);
      padding: 5px;
      flex-shrink: 0;
      color: #ffd5a6;
    }

    /* GRAFICO PULITO VOLUME & CARICHI */
    .chart-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(9, 9, 12, 0.88);
      border: 1px solid var(--border-dim);
    }

    .chart-svg {
      width: 100%;
      height: 92px;
      display: block;
    }

    .chart-bar {
      fill: rgba(255, 178, 102, 0.35);
      stroke: rgba(255, 178, 102, 0.85);
      stroke-width: 1.1;
      rx: 4;
      transition: fill 0.2s ease;
    }

    .chart-bar.peak {
      fill: rgba(255, 178, 102, 0.82);
    }

    .chart-line {
      fill: none;
      stroke: #ffd5a6;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-grid {
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 0.8;
      stroke-dasharray: 2 3;
    }

    .live-metrics-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border-dim);
    }

    .metric-pair {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .metric-val {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .ex-row {
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
    }

    .tabs-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs-row::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid var(--border-dim);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s var(--ease-glide);
    }

    .tab-pill.active {
      background: rgba(255, 178, 102, 0.2);
      color: #ffd5a6;
      border-color: var(--border-lit);
      box-shadow: 0 0 14px rgba(255, 168, 76, 0.14);
    }

    .equip-chip {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.68rem;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.035);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s var(--ease-glide);
    }

    .equip-chip.active {
      background: rgba(255, 178, 102, 0.22);
      color: var(--accent-amber-soft);
      border-color: var(--border-lit);
    }

    .sets-head {
      display: grid;
      grid-template-columns: 36px 1.1fr 1fr 1fr 34px;
      gap: 6px;
      padding: 0 2px 5px;
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .set-swipe-wrap {
      position: relative;
      border-radius: 11px;
      margin-bottom: 6px;
      overflow: hidden;
      background: linear-gradient(90deg, transparent 35%, var(--danger-bg) 100%);
    }

    .set-swipe-wrap:last-child {
      margin-bottom: 0;
    }

    .set-swipe-hint {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--danger-text);
      pointer-events: none;
    }

    .set-row {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 36px 1.1fr 1fr 1fr 34px;
      gap: 6px;
      align-items: center;
      padding: 5px 6px;
      border-radius: 11px;
      background: rgba(16, 16, 20, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      touch-action: pan-y;
      transition: transform 0.2s var(--ease-glide), opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .set-row.done {
      background: linear-gradient(90deg, rgba(22, 46, 31, 0.94), rgba(34, 197, 94, 0.22));
      border-color: var(--ok-border);
    }

    .set-row.swipe-armed {
      background: rgba(58, 16, 20, 0.96);
      border-color: var(--danger-border);
    }

    .set-badge {
      width: 30px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--glass-grey);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-variant-numeric: tabular-nums;
    }

    .set-badge.type-w { color: #fcd34d; border-color: rgba(252, 211, 77, 0.45); }
    .set-badge.type-d { color: #93c5fd; border-color: rgba(147, 197, 253, 0.45); }
    .set-badge.type-f { color: #fca5a5; border-color: rgba(252, 165, 165, 0.45); }
    .set-badge.type-s { color: #c4b5fd; border-color: rgba(196, 181, 253, 0.45); }

    .prev-cell {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .set-in {
      width: 100%;
      border-radius: 9px;
      border: 1px solid var(--border-dim);
      background: rgba(8, 8, 11, 0.94);
      color: var(--text-main);
      padding: 6px 6px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: border-color 0.18s ease;
    }

    .set-in:focus {
      border-color: var(--border-lit);
    }

    .check-box {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
      background: var(--glass-grey);
      color: var(--text-main);
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.16s var(--ease-glide), background 0.2s ease, border-color 0.2s ease;
    }

    .check-box:active {
      transform: scale(0.9);
    }

    .set-row.done .check-box {
      background: #4ade80;
      border-color: #bbf7d0;
      color: #052e16;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.35);
    }

    .note-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border-dim);
      font-size: 0.78rem;
      line-height: 1.46;
      color: var(--text-main);
      white-space: pre-line;
      font-variant-numeric: tabular-nums;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi-cell {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dim);
      text-align: center;
    }

    .kpi-val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .day-line {
      display: grid;
      grid-template-columns: 42px 1fr 32px;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dim);
    }

    .empty-box {
      padding: 22px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .bottom-rest-timer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(68px + env(safe-area-inset-bottom));
      z-index: 34;
      padding: 0 12px;
      pointer-events: none;
      display: none;
    }

    .bottom-rest-timer.open {
      display: block;
      animation: smoothGlideIn 0.25s var(--ease-glide) both;
    }

    .rest-bar-card {
      pointer-events: auto;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 16px;
      padding: 9px 12px;
      background: rgba(18, 18, 22, 0.96);
      border: 1px solid var(--border-lit);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.82), 0 0 22px var(--glow-amber);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #restTimerDigits {
      font-variant-numeric: tabular-nums;
    }

    .dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 35;
      padding: 0 14px;
      pointer-events: none;
    }

    .dock {
      pointer-events: auto;
      max-width: 440px;
      margin: 0 auto;
      border-radius: 9999px;
      padding: 5px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: rgba(18, 18, 22, 0.94);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dock-btn {
      border: none;
      background: transparent;
      border-radius: 9999px;
      padding: 7px 6px;
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.24s var(--ease-glide);
    }

    .dock-btn:hover { color: #ffd5a6; }

    .dock-btn.active {
      color: var(--text-main);
      background: rgba(255, 178, 102, 0.16);
      box-shadow: 0 0 18px var(--glow-amber);
    }

    .dock-btn.active::after {
      content: "";
      width: 12px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent-amber);
      box-shadow: 0 0 10px rgba(255, 178, 102, 0.85);
      margin-top: 1px;
    }

    function detectMuscle(exerciseName) {
      const n = (exerciseName || "").toLowerCase();
      const found = EXERCISE_CATALOG.find((e) => e.name.toLowerCase() === n);
      if (found) return found.muscle;
      if (n.includes("panca") || n.includes("petto") || n.includes("chest") || n.includes("croci") || n.includes("butterfly") || n.includes("pec")) return "petto";
      if (n.includes("lat") || n.includes("trazion") || n.includes("rematore") || n.includes("pulley") || n.includes("row") || n.includes("dorso") || n.includes("schiena")) return "schiena";
      if (n.includes("spall") || n.includes("lento") || n.includes("shoulder") || n.includes("alzate") || n.includes("deltoid")) return "spalle";
      if (n.includes("curl") || n.includes("bicip") || n.includes("tricip") || n.includes("pushdown") || n.includes("hammer") || n.includes("french") || n.includes("skull")) return "braccia";
      if (n.includes("squat") || n.includes("leg") || n.includes("pressa") || n.includes("press") || n.includes("affond") || n.includes("stacco") || n.includes("hip") || n.includes("calf") || n.includes("gambe")) return "gambe";
      if (n.includes("addom") || n.includes("crunch") || n.includes("plank")) return "addome";
      return "petto";
    }

    function renderVolumeChartSvg(historyList) {
      const sessions = (historyList || []).slice(0, 7).reverse();
      if (!sessions.length) {
        return `<div class="muted-xs" style="text-align:center;padding:12px 4px;">Nessun dato volume recente</div>`;
      }
      const vols = sessions.map((s) => Math.max(0, Number(s.volumeKg) || 0));
      const maxVal = Math.max(...vols, 1);
      const w = 320;
      const h = 92;
      const padTop = 12;
      const padBot = 20;
      const chartH = h - padTop - padBot;
      const stepX = w / sessions.length;
      const barW = Math.min(28, Math.max(12, stepX * 0.52));

      const bars = vols.map((v, i) => {
        const bh = Math.max(4, (v / maxVal) * chartH);
        const x = i * stepX + (stepX - barW) / 2;
        const y = padTop + (chartH - bh);
        const isPeak = v === Math.max(...vols) && v > 0;
        const lbl = sessions[i].dateStr ? sessions[i].dateStr.slice(0, 5) : `#${i + 1}`;
        return `
          <rect class="chart-bar ${isPeak ? "peak" : ""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" />
          <text x="${(x + barW / 2).toFixed(1)}" y="${h - 5}" text-anchor="middle" fill="#8c8f99" font-size="8.5" font-family="Plus Jakarta Sans, sans-serif">${escapeHtml(lbl)}</text>
        `;
      }).join("");

      const points = vols.map((v, i) => {
        const bh = Math.max(4, (v / maxVal) * chartH);
        const x = i * stepX + stepX / 2;
        const y = padTop + (chartH - bh);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");

      return `
        <div class="head-row" style="margin-bottom:4px;">
          <span class="muted-xs">Andamento volume sessioni</span>
          <span class="muted-xs" style="color:#ffd5a6;font-weight:700;">Max ${Math.round(Math.max(...vols)).toLocaleString("it-IT")} kg</span>
        </div>
        <svg class="chart-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">
          <line class="chart-grid" x1="8" y1="${padTop}" x2="${w - 8}" y2="${padTop}" />
          <line class="chart-grid" x1="8" y1="${(padTop + chartH / 2).toFixed(1)}" x2="${w - 8}" y2="${(padTop + chartH / 2).toFixed(1)}" />
          ${bars}
          ${vols.length > 1 ? `<polyline class="chart-line" points="${points}" />` : ""}
        </svg>
      `;
    }

      try {

        const p = JSON.parse(raw);
        return {
          profile: {
            heightCm: p.profile?.heightCm ?? "",
            weightKg: p.profile?.weightKg ?? "",
            somatotype: p.profile?.somatotype ?? ""
          },
          routines: Array.isArray(p.routines) ? p.routines : [],
          selectedRoutineId: p.selectedRoutineId ?? null,

          accumulatedSessionSec: parseInt(p.accumulatedSessionSec, 10) || 0,

      const ref = doc(db, "gymWorkspaces", profileCode);
      unsubCloud = onSnapshot(ref, async (snap) => {
        if (!snap.exists()) {
          await setDoc(ref, {
            profile: state.profile,
            routines: state.routines,
            selectedRoutineId: state.selectedRoutineId,
            weeklyPlan: state.weeklyPlan,
            activeWorkout: state.activeWorkout,
            accumulatedSessionSec: state.accumulatedSessionSec,
            history: state.history,
            updatedAt: serverTimestamp()
          });
          return;
        }
        const data = snap.data() || {};
        isApplyingCloud = true;
        if (data.profile) state.profile = { ...state.profile, ...data.profile };
        if (Array.isArray(data.routines)) state.routines = data.routines;
        if (data.selectedRoutineId !== undefined) state.selectedRoutineId = data.selectedRoutineId;
        if (data.weeklyPlan) state.weeklyPlan = { ...emptyState.weeklyPlan, ...data.weeklyPlan };
        if (data.activeWorkout !== undefined) state.activeWorkout = data.activeWorkout;
        if (data.accumulatedSessionSec !== undefined) state.accumulatedSessionSec = parseInt(data.accumulatedSessionSec, 10) || 0;

    function suggestExerciseForBodyAndMuscle(muscleKey) {
      const pool = EXERCISE_CATALOG.filter((e) => e.muscle === muscleKey);
      const list = pool.length ? pool : EXERCISE_CATALOG;
      const soma = state.profile.somatotype || "";
      let recommended = list[0];
      let sets = 3;
      let reps = "8-12";
      let rest = recommended.rest;

      if (soma === "ectomorfo") {
        recommended = list.find((x) => x.equips.includes("Bilanciere") || x.equips.includes("Macchinario")) || list[0];
        sets = 3;
        reps = "6-10";
        rest = Math.max(recommended.rest, 105);
      } else if (soma === "endomorfo") {
        recommended = list.find((x) => x.equips.includes("Cavi") || x.equips.includes("Manubri")) || list[0];
        sets = 4;
        reps = "10-15";
        rest = Math.min(recommended.rest, 75);
      } else if (soma === "mesomorfo") {
        sets = 4;
        reps = "8-12";
      }

      return {
        name: recommended.name,
        equipment: recommended.equips?.[0] || "",
        sets,
        reps,
        rest
      };
    }

    function getPreviousSetLabel(exName, setIdx) {
      const target = (exName || "").toLowerCase();
      for (const h of state.history || []) {
        if (!Array.isArray(h.exercisesSnap)) continue;
        const found = h.exercisesSnap.find((e) => (e.name || "").toLowerCase() === target);
        if (found && Array.isArray(found.sets) && found.sets[setIdx]) {
          const s = found.sets[setIdx];
          if (s.kg && s.reps) return `${s.kg}kg x ${s.reps}`;
        }
      }
      return "—";
    }

    function computePersonalRecords() {
      const prMap = new Map();
      const scanExercise = (exName, sets) => {
        const name = (exName || "").trim();
        if (!name) return;
        (sets || []).forEach((s) => {
          if (!s.done || s.mode === "W") return;
          const kg = parseFloat(s.kg) || 0;
          const reps = parseInt(s.reps, 10) || 0;
          if (kg <= 0 || reps <= 0) return;
          const est1rm = reps === 1 ? kg : kg * (1 + reps / 30);
          const prev = prMap.get(name);
          if (!prev || kg > prev.maxKg || est1rm > prev.est1rm) {
            prMap.set(name, {
              name,
              maxKg: prev ? Math.max(prev.maxKg, kg) : kg,
              bestRepsAtMax: kg >= (prev?.maxKg || 0) ? reps : prev.bestRepsAtMax,
              est1rm: prev ? Math.max(prev.est1rm, est1rm) : est1rm
            });
          }
        });
      };

      if (state.activeWorkout?.exercises) {
        state.activeWorkout.exercises.forEach((ex) => scanExercise(ex.name, ex.sets));
      }
      (state.history || []).forEach((h) => {
        if (Array.isArray(h.exercisesSnap)) {
          h.exercisesSnap.forEach((ex) => scanExercise(ex.name, ex.sets));
        }
      });

      return Array.from(prMap.values()).sort((a, b) => b.est1rm - a.est1rm);
    }

      const eqStr = ex.equipment ? ` · ${ex.equipment}` : "";
      const pr = computePersonalRecords().find((r) => r.name.toLowerCase() === (ex.name || "").toLowerCase());
      const prStr = pr ? ` · PR ${pr.maxKg}kg (1RM ~${pr.est1rm.toFixed(1)}kg)` : "";
      return `${ex.name}${eqStr} — ${baseTip}${prStr}`;

    // SWIPE A SINISTRA PER ELIMINARE UNA SERIE
    function attachSwipeLeftToDelete(rowEl, hintEl, onDelete) {
      let startX = null;
      let startY = null;
      let dx = 0;

      const onStart = (clientX, clientY) => {
        startX = clientX;
        startY = clientY;
        dx = 0;
      };

      const onMove = (clientX, clientY) => {
        if (startX === null) return;
        const moveX = clientX - startX;
        const moveY = clientY - startY;
        if (Math.abs(moveY) > Math.abs(moveX) && dx === 0) return;
        if (moveX < 0) {
          dx = Math.max(moveX, -124);
          rowEl.style.transform = `translateX(${dx}px)`;
          const armed = dx <= -66;
          rowEl.classList.toggle("swipe-armed", armed);
          if (hintEl) {
            hintEl.style.opacity = String(Math.min(1, Math.abs(dx) / 66));
            hintEl.textContent = armed ? "Rilascia" : "Elimina";
          }
        }
      };

      const onEnd = () => {
        if (startX === null) return;
        const shouldDelete = dx <= -66;
        startX = null;
        startY = null;
        if (shouldDelete) {
          rowEl.style.transform = "translateX(-100%)";
          rowEl.style.opacity = "0";
          setTimeout(onDelete, 160);
        } else {
          dx = 0;
          rowEl.style.transform = "";
          rowEl.classList.remove("swipe-armed");
          if (hintEl) {
            hintEl.style.opacity = "0";
            hintEl.textContent = "Elimina";
          }
        }
      };

      rowEl.addEventListener("touchstart", (e) => {
        if (e.target.tagName === "INPUT") return;
        const t = e.touches[0];
        if (t) onStart(t.clientX, t.clientY);
      }, { passive: true });

      rowEl.addEventListener("touchmove", (e) => {
        if (startX === null) return;
        const t = e.touches[0];
        if (t) onMove(t.clientX, t.clientY);
      }, { passive: true });

      rowEl.addEventListener("touchend", onEnd);
      rowEl.addEventListener("touchcancel", onEnd);

      rowEl.addEventListener("pointerdown", (e) => {
        if (e.pointerType !== "mouse" || e.button !== 0 || e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
        onStart(e.clientX, e.clientY);
        const moveWin = (ev) => onMove(ev.clientX, ev.clientY);
        const upWin = () => {
          window.removeEventListener("pointermove", moveWin);
          window.removeEventListener("pointerup", upWin);
          onEnd();
        };
        window.addEventListener("pointermove", moveWin);
        window.addEventListener("pointerup", upWin);
      });
    }

    function parseCsvFallback(text) {
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines.length) return [];
      const sep = lines[0].includes(";") && !lines[0].includes(",") ? ";" : ",";
      const splitRow = (row) => {
        const out = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
          const ch = row[i];
          if (ch === '"') inQuotes = !inQuotes;
          else if (ch === sep && !inQuotes) { out.push(cur.trim()); cur = ""; }
          else cur += ch;
        }
        out.push(cur.trim());
        return out;
      };

      const firstCols = splitRow(lines[0]).map((c) => c.toLowerCase());
      const hasHeader = firstCols.some((c) => ["exercise", "esercizio", "title", "workout", "scheda", "weight", "peso", "reps", "ripetizioni"].includes(c));
      const startIdx = hasHeader ? 1 : 0;

      const idxWorkout = hasHeader ? firstCols.findIndex((c) => ["workout", "scheda", "title", "session", "routine"].includes(c)) : -1;
      const idxEx = hasHeader ? firstCols.findIndex((c) => ["exercise", "esercizio", "name", "movement"].includes(c)) : 0;
      const idxWeight = hasHeader ? firstCols.findIndex((c) => ["weight", "peso", "kg"].includes(c)) : 1;
      const idxReps = hasHeader ? firstCols.findIndex((c) => ["reps", "ripetizioni", "rep"].includes(c)) : 2;

      const rows = [];
      for (let i = startIdx; i < lines.length; i++) {
        const cols = splitRow(lines[i]);
        const exName = (cols[idxEx >= 0 ? idxEx : 0] || "").replace(/^"|"$/g, "").trim();
        if (!exName) continue;
        const kgVal = parseFloat((cols[idxWeight >= 0 ? idxWeight : 1] || "").replace(",", ".")) || 0;
        const repsVal = parseInt((cols[idxReps >= 0 ? idxReps : 2] || "0"), 10) || 0;
        const routineName = idxWorkout >= 0 && cols[idxWorkout]
          ? cols[idxWorkout].replace(/^"|"$/g, "").trim()
          : (detectMuscle(exName) ? MUSCLE_LABELS[detectMuscle(exName)] : "Scheda CSV");
        rows.push({ routineName, exName, kgVal, repsVal });
      }
      return rows;
    }

    async function parseCsvWithAiIfAvailable(csvText) {
      const fallbackRows = parseCsvFallback(csvText);
      if (!geminiApiKey) return fallbackRows;
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Analizza questo CSV di allenamento e restituisci SOLO un JSON array di oggetti {"routineName":"nome scheda","exName":"nome esercizio","kgVal":0,"repsVal":0}. Separa bene ogni scheda e ogni singolo esercizio. CSV:\n${csvText.slice(0, 9000)}`
                }]
              }]
            })
          }
        );
        const data = await res.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleaned = rawText.replace(/```json|```/gi, "").trim();
        const parsed = JSON.parse(cleaned);
        if (Array.isArray(parsed) && parsed.length) {
          return parsed.map((r) => ({
            routineName: String(r.routineName || "Scheda CSV").trim(),
            exName: String(r.exName || "").trim(),
            kgVal: parseFloat(r.kgVal) || 0,
            repsVal: parseInt(r.repsVal, 10) || 0
          })).filter((r) => r.exName);
        }
        return fallbackRows;
      } catch {
        return fallbackRows;
      }
    }

      const fileInput = document.getElementById("csvFileInput");
      const statusBox = document.getElementById("csvImportStatus");
      const file = fileInput.files?.[0];
      statusBox.classList.remove("hidden");

      if (!file) {
        statusBox.textContent = "Seleziona un file CSV.";
        return;
      }

      statusBox.textContent = "...";
      const reader = new FileReader();
      reader.onload = async () => {
        const rows = await parseCsvWithAiIfAvailable(String(reader.result || ""));
        if (!rows.length) {
          statusBox.textContent = "Nessun esercizio trovato.";
          return;
        }

        const grouped = new Map();
        rows.forEach((item) => {
          const rKey = item.routineName || "Scheda CSV";
          const eKey = item.exName;
          if (!grouped.has(rKey)) grouped.set(rKey, new Map());
          const exMap = grouped.get(rKey);
          if (!exMap.has(eKey)) exMap.set(eKey, []);
          exMap.get(eKey).push({
            kg: item.kgVal ? String(item.kgVal) : "",
            reps: item.repsVal ? String(item.repsVal) : "",
            done: true
          });
        });

        let createdR = 0;
        let createdEx = 0;

        grouped.forEach((exMap, rName) => {
          const exercisesForRoutine = [];
          const exercisesSnap = [];
          let totalSets = 0;
          let totalVol = 0;

          exMap.forEach((setsList, exName) => {
            createdEx += 1;
            exercisesForRoutine.push({
              id: uid("ex"),
              name: exName,
              equipment: "",
              sets: Math.max(1, setsList.length),
              repsTarget: setsList[0]?.reps || "8-12",
              restSec: 90
            });
            const formattedSets = setsList.map((s, i) => ({
              num: i + 1,
              mode: "N",
              kg: s.kg,
              reps: s.reps,
              done: true
            }));
            exercisesSnap.push({ name: exName, sets: formattedSets });
            totalSets += formattedSets.length;
            totalVol += formattedSets.reduce((acc, s) => acc + (parseFloat(s.kg) || 0) * (parseInt(s.reps, 10) || 0), 0);
          });

          state.routines.unshift({
            id: uid("r"),
            name: rName,
            exercises: exercisesForRoutine
          });
          if (!state.selectedRoutineId) state.selectedRoutineId = state.routines[0].id;
          createdR += 1;

          state.history.unshift({
            id: uid("h"),
            routineName: rName,
            note: "CSV",
            dateIso: new Date().toISOString(),
            dateStr: new Date().toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }),
            doneSets: totalSets,
            volumeKg: Math.round(totalVol),
            exercisesSnap
          });
        });

        saveState();
        renderSchede();
        statusBox.textContent = `${createdR} schede · ${createdEx} esercizi${geminiApiKey ? " · IA" : ""}`;
      };
      reader.readAsText(file);
    };

    function syncProfileInputsFromState() {
      document.getElementById("profileHeightInput").value = state.profile.heightCm || "";
      document.getElementById("profileWeightInput").value = state.profile.weightKg || "";
      document.getElementById("profileSomatotypeInput").value = state.profile.somatotype || "";
      document.getElementById("geminiApiKeyInput").value = geminiApiKey;
    }

    function renderProfiloSection() {
      const now = Date.now();
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
      const recent = (state.history || []).filter((h) => {
        const t = h.dateIso ? new Date(h.dateIso).getTime() : now;
        return !Number.isNaN(t) && (now - t) <= sevenDaysMs;
      });
      const wkSource = recent.length ? recent : state.history;
      document.getElementById("kpiWorkoutsCount").textContent = String(wkSource.length);
      document.getElementById("kpiSetsCount").textContent = String(wkSource.reduce((a, b) => a + (b.doneSets || 0), 0));
      document.getElementById("kpiVolumeKg").textContent = `${wkSource.reduce((a, b) => a + (b.volumeKg || 0), 0).toLocaleString("it-IT")} kg`;

      const chartBox = document.getElementById("profileVolumeChartBox");
      if (chartBox) chartBox.innerHTML = renderVolumeChartSvg(state.history);

      const planBox = document.getElementById("weeklyPlanContainer");
      planBox.innerHTML = "";
      DAYS.forEach((day) => {
        const row = document.createElement("div");
        row.className = "day-line";
        const assignedId = state.weeklyPlan[day] || "";
        row.innerHTML = `
          <span class="muted-xs" style="font-weight:800;color:var(--text-main);">${day}</span>
          <select class="clean-select day-routine-sel" style="padding:6px 8px;font-size:0.8rem;">
            <option value="">—</option>
            ${state.routines.map((r) => `<option value="${r.id}" ${r.id === assignedId ? "selected" : ""}>${escapeHtml(r.name)}</option>`).join("")}
          </select>
          <button type="button" class="circle-btn sm day-go-btn" title="Avvia">▶</button>
        `;
        const sel = row.querySelector(".day-routine-sel");
        sel.onchange = () => { state.weeklyPlan[day] = sel.value; saveState(); };
        row.querySelector(".day-go-btn").onclick = () => { if (sel.value) startRoutine(sel.value); };
        planBox.appendChild(row);
      });

      const prBox = document.getElementById("maxLiftsContainer");
      const prs = computePersonalRecords();
      if (!prs.length) {
        prBox.innerHTML = `<div class="muted-xs">—</div>`;
      } else {
        prBox.innerHTML = "";
        prs.slice(0, 8).forEach((pr) => {
          const line = document.createElement("div");
          line.className = "ex-row";
          line.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              ${renderExerciseIllustrationSvg(pr.name)}
              <div style="min-width:0;">
                <div style="font-weight:700;">${escapeHtml(pr.name)}</div>
                <div class="muted-xs">${pr.maxKg} kg × ${pr.bestRepsAtMax}</div>
              </div>
            </div>
            <span class="muted-xs" style="font-weight:800;color:var(--text-main);">1RM ~${pr.est1rm.toFixed(1)} kg</span>
          `;
          prBox.appendChild(line);
        });
      }
    }

    document.getElementById("saveProfileSectionBtn").onclick = () => {
      state.profile.heightCm = document.getElementById("profileHeightInput").value.trim();
      state.profile.weightKg = document.getElementById("profileWeightInput").value.trim();
      state.profile.somatotype = document.getElementById("profileSomatotypeInput").value;
      geminiApiKey = document.getElementById("geminiApiKeyInput").value.trim();
      localStorage.setItem(GEMINI_KEY_STORAGE, geminiApiKey);
      saveState();
      renderSchede();
      if (activeNav === "allenamento") renderAllenamento();
    };

    document.getElementById("createGymCodeBtn").onclick = () => {
      bindCloudProfile(`RAT-${Math.floor(1000 + Math.random() * 9000)}`);
    };

    document.getElementById("joinGymCodeBtn").onclick = () => {
      const inp = document.getElementById("joinGymCodeInput");
      const val = inp.value.trim();
      if (!val) return;
      inp.value = "";
      bindCloudProfile(val);
    };

    document.getElementById("generatePtRoutineBtn").onclick = () => {
      const split = document.getElementById("ptSplitSelect").value;
      const goal = document.getElementById("ptGoalSelect").value;
      const repsMap = { ipertrofia: "8-12", forza: "4-6", tonificazione: "12-15" };
      const setsMap = { ipertrofia: 3, forza: 4, tonificazione: 3 };
      const repsTarget = repsMap[goal] || "8-12";
      const sets = setsMap[goal] || 3;
      const mk = (name, equipment, restSec) => ({ id: uid("ex"), name, equipment, sets, repsTarget, restSec });

      let routines = [];
      if (split === "ppl") {
        routines = [
          { id: uid("r"), name: "Push", exercises: [mk("Panca piana bilanciere", "Bilanciere", 120), mk("Chest press", "Macchinario", 90), mk("Alzate laterali", "Cavi", 60), mk("Pushdown tricipiti", "Cavi", 75)] },
          { id: uid("r"), name: "Pull", exercises: [mk("Lat machine", "Macchinario", 90), mk("Rematore", "Manubri", 105), mk("Alzate posteriori / Reverse fly", "Cavi", 60), mk("Curl bicipiti", "Cavi", 75)] },
          { id: uid("r"), name: "Legs", exercises: [mk("Squat", "Bilanciere", 150), mk("Leg press / Pressa", "Macchinario", 120), mk("Leg curl", "Macchinario", 75), mk("Calf raise / Polpacci", "Macchinario", 60)] }
        ];
      } else if (split === "upper_lower") {
        routines = [
          { id: uid("r"), name: "Upper", exercises: [mk("Panca inclinata", "Manubri", 90), mk("Pulley / Row basso", "Cavi", 90), mk("Lento / Shoulder press", "Macchinario", 105), mk("Curl bicipiti", "Cavi", 75)] },
          { id: uid("r"), name: "Lower", exercises: [mk("Leg press / Pressa", "Macchinario", 120), mk("Stacco rumeno / RDL", "Manubri", 120), mk("Leg extension", "Macchinario", 75), mk("Plank", "Corpo libero", 60)] }
        ];
      } else {
        routines = [
          { id: uid("r"), name: "Full Body", exercises: [mk("Squat", "Bilanciere", 120), mk("Chest press", "Macchinario", 90), mk("Lat machine", "Macchinario", 90), mk("Alzate laterali", "Manubri", 60), mk("Plank", "Corpo libero", 60)] }
        ];
      }

      state.routines = [...routines, ...state.routines];
      state.selectedRoutineId = routines[0].id;
      saveState();
      renderSchede();
      document.getElementById("ptCoachOutput").textContent = `${split.toUpperCase()} · ${routines.length} schede`;
    };

    function renderReadinessAnalysis() {
      const box = document.getElementById("ptReadinessBox");
      const chartBox = document.getElementById("ptVolumeChartBox");
      if (chartBox) chartBox.innerHTML = renderVolumeChartSvg(state.history);
      if (!box) return;
      const now = Date.now();
      const dayMs = 24 * 60 * 60 * 1000;
      const last3dVol = (state.history || []).filter((h) => (now - new Date(h.dateIso || now).getTime()) <= 3 * dayMs)
        .reduce((a, b) => a + (b.volumeKg || 0), 0);
      const last7dVol = (state.history || []).filter((h) => (now - new Date(h.dateIso || now).getTime()) <= 7 * dayMs)
        .reduce((a, b) => a + (b.volumeKg || 0), 0);
      const weeklyAvg3d = last7dVol > 0 ? last7dVol * (3 / 7) : 0;
      const ratio = weeklyAvg3d > 0 ? last3dVol / weeklyAvg3d : 1;

      let status = "Prontezza: Alta";
      let action = "Spinta normale / progressione carico";
      if (ratio > 1.35) {
        status = "Prontezza: Carico alto";
        action = "Mantieni carichi e cura recupero (90–120s)";
      } else if (ratio < 0.65 && last7dVol > 0) {
        status = "Prontezza: Fresco";
        action = "Ottimo momento per qualità e serie target";
      }

      box.textContent = `${status} · 3g: ${Math.round(last3dVol).toLocaleString("it-IT")} kg · 7g: ${Math.round(last7dVol).toLocaleString("it-IT")} kg\n→ ${action}`;
    }

    document.getElementById("refreshReadinessBtn").onclick = renderReadinessAnalysis;

    function buildLocalPtReply() {
      const bodyStr = getBodySummaryText() || "Profilo base";
      const s = state.profile.somatotype;
      if (s === "ectomorfo") return `${bodyStr} · Focus carichi base e recuperi 90–180s.`;
      if (s === "endomorfo") return `${bodyStr} · Volume controllato, recuperi 60–90s e costanza.`;
      if (s === "mesomorfo") return `${bodyStr} · Progressione carichi su range 6–12 rip.`;
      return `${bodyStr} · Imposta i dati in Profilo per consigli su misura.`;
    }

    async function askPt(question) {
      const out = document.getElementById("ptCoachOutput");
      const text = (question || "").trim();
      if (!geminiApiKey) {
        out.textContent = buildLocalPtReply();
        return;
      }
      out.textContent = "...";
      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Sei un Personal Trainer sintetico in italiano. Profilo: ${getBodySummaryText() || "N/D"}. Domanda: ${text || "Consiglio allenamento."}`
                }]
              }]
            })
          }
        );
        const json = await res.json();
        const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
        out.textContent = reply ? reply.trim() : buildLocalPtReply();
      } catch {
        out.textContent = buildLocalPtReply();
      }
    }

    document.getElementById("ptAskBtn").onclick = () => {
      const inp = document.getElementById("ptQuestionInput");
      askPt(inp.value);
      inp.value = "";
    };

    document.getElementById("ptBodyAdviceBtn").onclick = () => {
      askPt("Consiglio su misura sul mio corpo.");
    };

    document.getElementById("calcPlatesBtn").onclick = () => {
      const total = parseFloat(document.getElementById("targetBarKgInput").value);
      const bar = parseFloat(document.getElementById("barWeightSelect").value) || 20;
      const box = document.getElementById("platesResultBox");
      box.classList.remove("hidden");
      if (!total || total <= bar) {
        box.textContent = `> ${bar} kg`;
        return;
      }
      let perSide = (total - bar) / 2;
      const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
      const used = [];
      for (const p of plates) {
        while (perSide >= p - 0.001) {
          used.push(`${p}`);
          perSide -= p;
        }
      }
      box.textContent = `Lato (${((total - bar) / 2).toFixed(2)} kg): ${used.length ? used.join(" + ") + " kg" : "Solo barra"}`;
    };

    const bottomRestTimer = document.getElementById("bottomRestTimer");
    const restTimerDigits = document.getElementById("restTimerDigits");
    const restTimerContext = document.getElementById("restTimerContext");

    let remainingSec = 0;
    let restInterval = null;

    function fmt(sec) {
      const s = Math.max(0, sec);
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }

    function updateRestUi() {
      restTimerDigits.textContent = fmt(remainingSec);
    }

    function hideRestTimer() {
      if (restInterval) { clearInterval(restInterval); restInterval = null; }
      remainingSec = 0;
      bottomRestTimer.classList.remove("open");
    }

    function startBottomRestTimer(sec, label = "") {
      if (restInterval) { clearInterval(restInterval); restInterval = null; }
      remainingSec = Math.max(5, parseInt(sec, 10) || 90);
      restTimerContext.textContent = label;
      updateRestUi();
      bottomRestTimer.classList.add("open");

      restInterval = setInterval(() => {
        remainingSec -= 1;
        if (remainingSec <= 0) hideRestTimer();
        else updateRestUi();
      }, 1000);
    }

    document.getElementById("sub15Btn").onclick = () => {
      remainingSec = Math.max(1, remainingSec - 15);
      updateRestUi();
    };
    document.getElementById("add15Btn").onclick = () => {
      remainingSec += 15;
      updateRestUi();
    };
    document.getElementById("skipTimerBtn").onclick = hideRestTimer;

    syncProfileInputsFromState();
    updateHeaderAndProfileBadges();
    renderSchede();
    renderProfiloSection();
    renderReadinessAnalysis();

    if (profileCode) bindCloudProfile(profileCode);
    signInAnonymously(auth).catch(() => {});
    onAuthStateChanged(auth, (u) => { if (u && profileCode) bindCloudProfile(profileCode); });
  </script>
</body>
</html>
